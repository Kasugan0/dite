[project]
name = "dite"
version = "1.0.0"
description = "Document Insight & Taxonomy Engine - Multimodal document intelligent clustering tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0.0",
    "hdbscan>=0.8.33",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",          # 配置文件
    "rich>=13.0.0",
    "typer>=0.12.0",        # CLI 框架
    "markitdown>=0.1.0",    # 旧版 Office 支持
    "scikit-learn>=1.3.0",  # k-NN 分类器
    "pdf2image>=1.16.0",    # PDF 转图片（VLM fallback）
]

[project.scripts]
dite = "dite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dite"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

# ===== Ruff Configuration =====
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
[tool.ruff.lint.isort]
known-first-party = ["dite"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["ref", ".git", ".venv", ".pytest_cache"]
